<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <style>
    text { font-family: Plex; fill: #202040; }
    .label { font-size: 10px; fill: #8a8378; }
    @keyframes breathe {
      0% { transform: scale(1); fill: #3d5a99; }
      50% { transform: scale(1.3); fill: #4c9e8a; }
      100% { transform: scale(1); fill: #3d5a99; }
    }
    .breathing { animation: breathe 3s ease-in-out infinite; transform-origin: 600px 120px; }
    .button { fill: #e8d5b5; stroke: #202040; stroke-width: 2px; transition: fill 0.4s ease, transform 0.3s ease-out; }
    .button:hover { fill: #f2b134; transform: translateY(-4px); }
    .button:active { fill: #e8574a; transition: fill 0.05s linear; }
  </style>
  <rect width="720" height="480" fill="#f4efe6" pointer-events="none"/>

  <text class="label" x="20" y="30">SMIL: ANIMATETRANSFORM, ANIMATEMOTION, ANIMATE</text>
  <g transform="translate(80 120)">
    <circle r="40" fill="none" stroke="#e8d5b5" stroke-width="10"/>
    <path d="M 0 -40 A 40 40 0 0 1 40 0" fill="none" stroke="#e8574a" stroke-width="10" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <path id="orbit" d="M 160 120 C 220 40 320 200 400 120" fill="none" stroke="#8a8378" stroke-dasharray="4 4"/>
  <path d="M -10 -6 L 10 0 L -10 6 z" fill="#202040">
    <animateMotion dur="3s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#orbit"/></animateMotion>
  </path>
  <rect x="440" y="80" width="80" height="80" fill="#e8574a">
    <animate attributeName="fill" values="#e8574a;#f2b134;#4c9e8a;#e8574a" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="0;40;0" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </rect>

  <text class="label" x="560" y="30">CSS @KEYFRAMES</text>
  <circle class="breathing" cx="600" cy="120" r="35"/>

  <text class="label" x="20" y="240">:HOVER AND :ACTIVE WITH TRANSITIONS</text>
  <rect class="button" x="20" y="260" width="140" height="50" rx="8"/>
  <rect class="button" x="180" y="260" width="140" height="50" rx="8"/>
  <rect class="button" x="340" y="260" width="140" height="50" rx="8"/>

  <text class="label" x="20" y="360">BEGIN="CLICK"</text>
  <circle id="target" cx="80" cy="420" r="30" fill="#3d5a99">
    <animate attributeName="r" values="30;45;30" dur="0.5s" begin="click"/>
    <animate attributeName="fill" to="#e8574a" dur="0.5s" begin="click" fill="freeze"/>
  </circle>
  <rect x="200" y="395" width="240" height="50" rx="8" fill="#4c9e8a">
    <animate attributeName="width" to="420" dur="1s" begin="target.click+0.5s" fill="freeze"/>
  </rect>
</svg>
