<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <rect x="0" y="0" width="720" height="480" fill="#f4efe6"/>
  <!-- basic shapes -->
  <g id="basics" stroke="#202020" stroke-width="4">
    <rect x="40" y="40" width="120" height="90" rx="16" fill="#e8574a"/>
    <circle cx="240" cy="85" r="48" fill="#f2b134"/>
    <ellipse cx="380" cy="85" rx="70" ry="40" fill="#4c9e8a"/>
    <polygon points="500,40 560,130 440,130" fill="#3d5a99"/>
    <polyline points="590,130 610,40 640,110 670,50 690,130" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- paths with curves and arcs -->
  <g id="paths" fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M 40 240 C 100 160, 160 320, 220 240 S 340 160, 380 240" stroke="#e8574a"/>
    <path d="M 420 260 Q 480 160 540 260 T 660 260" stroke="#3d5a99"/>
    <path d="M 60 360 A 60 40 0 1 1 180 360" stroke="#4c9e8a"/>
    <path d="M 220 330 h 80 v 60 h -80 z m 20 15 h 40 v 30 h -40 z" fill="#f2b134" fill-rule="evenodd" stroke="#202020" stroke-width="3"/>
  </g>
  <!-- nested groups with transforms -->
  <g id="transforms" transform="translate(520 380)">
    <g fill="#3d5a99" fill-opacity="0.35" stroke="#3d5a99" stroke-width="2">
      <rect x="-40" y="-40" width="80" height="80" transform="rotate(0)"/>
      <rect x="-40" y="-40" width="80" height="80" transform="rotate(15) scale(0.9)"/>
      <rect x="-40" y="-40" width="80" height="80" transform="rotate(30) scale(0.8)"/>
      <rect x="-40" y="-40" width="80" height="80" transform="rotate(45) scale(0.7)"/>
      <rect x="-40" y="-40" width="80" height="80" transform="rotate(60) scale(0.6)"/>
    </g>
    <g transform="translate(120 0) skewX(-20)">
      <rect x="-25" y="-40" width="50" height="80" fill="#e8574a" opacity="0.8"/>
    </g>
  </g>
</svg>
