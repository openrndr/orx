<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <!-- a checkerboard in user space: the tiles line up across shapes -->
    <pattern id="checkers" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="#f4efe6"/>
      <rect width="20" height="20" fill="#3d5a99"/>
      <rect x="20" y="20" width="20" height="20" fill="#3d5a99"/>
    </pattern>
    <!-- four by four tiles over the bounds of a shape, with content in user space -->
    <pattern id="dots" width="0.25" height="0.25">
      <rect width="50" height="40" fill="#f2b134"/>
      <circle cx="12" cy="12" r="8" fill="#e8574a"/>
    </pattern>
    <!-- content in bounds units: one diamond per tile, whatever the size of the shape -->
    <pattern id="diamonds" width="0.2" height="0.25" patternContentUnits="objectBoundingBox">
      <rect width="0.2" height="0.25" fill="#4c9e8a"/>
      <path d="M 0.1 0 L 0.2 0.125 L 0.1 0.25 L 0 0.125 Z" fill="#f4efe6"/>
    </pattern>
    <!-- a view box that is fitted into the tile -->
    <pattern id="stars" patternUnits="userSpaceOnUse" width="60" height="40" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <rect width="100" height="100" fill="#202040"/>
      <path d="M 50 5 L 79 95 L 2 39 L 98 39 L 21 95 Z" fill="#ffd27a"/>
    </pattern>
    <!-- stripes, turned by the pattern transform -->
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(30)">
      <rect width="16" height="16" fill="#f4efe6"/>
      <rect width="8" height="16" fill="#e8574a"/>
    </pattern>
    <!-- a pattern with a gradient in it, and a pattern that inherits its content and changes its size -->
    <linearGradient id="sunset">
      <stop offset="0" stop-color="#ffcc00"/>
      <stop offset="1" stop-color="#3322aa"/>
    </linearGradient>
    <pattern id="tiles" patternUnits="userSpaceOnUse" width="30" height="30">
      <rect x="1" y="1" width="28" height="28" rx="6" fill="url(#sunset)"/>
    </pattern>
    <pattern id="bigTiles" xlink:href="#tiles" patternTransform="scale(2)"/>
  </defs>
  <rect width="720" height="480" fill="#ffffff"/>
  <rect x="20" y="20" width="200" height="130" fill="url(#checkers)"/>
  <circle cx="320" cy="85" r="65" fill="url(#checkers)"/>
  <ellipse cx="560" cy="85" rx="140" ry="65" fill="url(#dots)"/>
  <rect x="20" y="180" width="200" height="120" fill="url(#diamonds)"/>
  <rect x="250" y="180" width="200" height="120" fill="url(#stars)"/>
  <circle cx="580" cy="240" r="60" fill="url(#stripes)"/>
  <rect x="20" y="330" width="200" height="130" fill="url(#tiles)"/>
  <rect x="250" y="330" width="200" height="130" fill="url(#bigTiles)"/>
  <path d="M 490 440 C 520 320, 640 320, 690 440" fill="none" stroke="url(#stripes)" stroke-width="28"/>
</svg>
