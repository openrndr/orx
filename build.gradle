abstract class VersionPrinterFlowAction implements FlowAction<Parameters> {
    interface Parameters extends FlowParameters {
        @Input
        Property<String> getVersion()
    }

    @Override
    void execute(Parameters parameters) {
        println("\n")
        println("orx = \"${parameters.version.get()}\"")
    }
}

// FlowScope.always() is the configuration-cache-compatible replacement for
// the deprecated `gradle.buildFinished` hook: it fires once, at the very end
// of every build (cache hit or not), regardless of build outcome.
abstract class VersionPrinterPlugin implements Plugin<Project> {
    @Inject
    abstract FlowScope getFlowScope()

    @Override
    void apply(Project project) {
        flowScope.always(VersionPrinterFlowAction) {
            it.parameters.version.set(project.provider { project.version.toString() })
        }
    }
}

apply plugin: VersionPrinterPlugin
