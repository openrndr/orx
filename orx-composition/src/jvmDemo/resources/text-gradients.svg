<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="sunset">
      <stop offset="0" stop-color="#ffcc00"/>
      <stop offset="0.5" stop-color="#ff3366"/>
      <stop offset="1" stop-color="#3322aa"/>
    </linearGradient>
    <linearGradient id="vertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22aa44"/>
      <stop offset="1" stop-color="#0044cc"/>
    </linearGradient>
    <linearGradient id="space" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#ff0055"/>
      <stop offset="1" stop-color="#00aaff"/>
    </linearGradient>
    <path id="arc" d="M 60 360 Q 300 200 540 360"/>
  </defs>
  <text id="t1" x="20" y="70" font-family="Plex" font-size="56" fill="url(#sunset)">Gradient text</text>
  <text id="t2" x="20" y="150" font-family="Plex" font-size="40" fill="url(#vertical)">bbox <tspan fill="url(#space)">and user space</tspan></text>
  <text id="t3" x="300" y="220" font-family="Plex" font-size="36" text-anchor="middle" fill="url(#sunset)" stroke="#000000" stroke-width="1">centered</text>
  <text id="t4" font-family="Plex" font-size="36" fill="url(#vertical)" stroke="url(#sunset)" stroke-width="2"><textPath xlink:href="#arc">along a curve</textPath></text>
</svg>
