name: Release snapshot to Maven Central
on:
  push:
    tags:
      - v[0-9].[0-9]+.[0-9]+-SNAPSHOT.[0-9]+
jobs:
  release_snapshot_to_maven_central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle init script for snapshot repository
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/snapshots.gradle
          beforeSettings { settings ->
            settings.dependencyResolutionManagement {
              repositories {
                maven {
                  name = 'Central Portal Snapshots'
                  url = 'https://central.sonatype.com/repository/maven-snapshots/'

                  content {
                    includeGroup("org.openrndr")
                  }
                }
              }
            }
          }

          allprojects {
            repositories {
              maven {
                name = 'Central Portal Snapshots'
                url = 'https://central.sonatype.com/repository/maven-snapshots/'

                content {
                  includeGroup("org.openrndr")
                }
              }
            }
          }
          EOF

      - name: Build ORX
        run: ./gradlew build snapshot

      - name: Decode
        run: |
          echo "${{secrets.SIGNING_SECRET_KEY_RING_FILE}}" > ~/.gradle/secring.gpg.b64
          base64 -d ~/.gradle/secring.gpg.b64 > ~/.gradle/secring.gpg

      - name: Publish
        run: ./gradlew publishAggregationToCentralSnapshots snapshot -Psigning.keyId=${{secrets.SIGNING_KEY_ID}} -Psigning.password=openrndr -Psigning.secretKeyRingFile=$(echo ~/.gradle/secring.gpg)
        env:
          OSSRH_USERNAME: ${{secrets.OSSRH_USERNAME}}
          OSSRH_PASSWORD: ${{secrets.OSSRH_PASSWORD}}
